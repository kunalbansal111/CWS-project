<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book an Appointment - Student Counselling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

  <!-- Navigation bar (same on every page) -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand" href="index.html"><img src="images/brain.png" alt="Logo" height="30"> Student Counselling</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Our Services</a></li>
          <li class="nav-item"><a class="nav-link" href="resources.html">Resources</a></li>
          <li class="nav-item"><a class="nav-link active" href="appointment.html">Book an Appointment</a></li>
          <li class="nav-item ms-lg-2"><a class="btn btn-purple btn-sm" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container py-5">
    <h1 class="fw-bold">Book an Appointment</h1>
    <p class="text-muted mb-4">Choose a date and time for your counselling session.</p>
    <div class="row g-4 align-items-center">
      <div class="col-md-4 text-center">
        <img src="images/calendar.png" class="img-fluid" alt="Calendar">
      </div>
      <div class="col-md-8">
        <form class="card card-soft p-4" action="#">
          <label for="date" class="form-label fw-semibold">Select a date</label>
          <input type="date" class="form-control mb-4" id="date" required>
          <p class="fw-semibold mb-2">Available time slots</p>
          <div class="row g-2 mb-4">
            <div class="col-4">
              <input type="radio" class="btn-check" name="slot" id="slot0" required>
              <label class="btn btn-outline-secondary w-100" for="slot0">9:00 AM</label>
            </div>
            <div class="col-4">
              <input type="radio" class="btn-check" name="slot" id="slot1" required>
              <label class="btn btn-outline-secondary w-100" for="slot1">10:00 AM</label>
            </div>
            <div class="col-4">
              <input type="radio" class="btn-check" name="slot" id="slot2" required>
              <label class="btn btn-outline-secondary w-100" for="slot2">11:00 AM</label>
            </div>
            <div class="col-4">
              <input type="radio" class="btn-check" name="slot" id="slot3" required>
              <label class="btn btn-outline-secondary w-100" for="slot3">2:00 PM</label>
            </div>
            <div class="col-4">
              <input type="radio" class="btn-check" name="slot" id="slot4" required>
              <label class="btn btn-outline-secondary w-100" for="slot4">3:00 PM</label>
            </div>
            <div class="col-4">
              <input type="radio" class="btn-check" name="slot" id="slot5" required>
              <label class="btn btn-outline-secondary w-100" for="slot5">4:00 PM</label>
            </div>
          </div>
          <button type="submit" class="btn btn-purple btn-lg w-100">Confirm Appointment</button>
        </form>
      </div>
    </div>
  </section>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
